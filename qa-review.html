<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prestigious Residence · Local responsive QA</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui;background:#d7dce3;color:#152235}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px;background:white}label{display:flex;align-items:center;gap:6px}button,select{font:inherit;min-height:36px;padding:6px 10px}#stage{margin:16px auto;position:relative}iframe{display:block;border:0;transform-origin:top left;background:white}#report{padding:16px;margin:0;background:white;white-space:pre-wrap}#testStatus{color:#526070}
</style></head><body>
<header><strong>Preview QA · no real leads sent</strong>
<label>Viewport<select id="size"><option value="390,844">Mobile 390 × 844</option><option value="320,740">Small mobile 320 × 740</option><option value="768,1024">Tablet 768 × 1024</option><option value="1024,768">Landscape 1024 × 768</option><option value="1440,960">Desktop 1440 × 960</option></select></label>
<label>Delivery<select id="result"><option value="success">Success</option><option value="error">Server error</option><option value="timeout">Timeout</option><option value="analytics_error">Analytics error</option><option value="nojs">JavaScript off</option></select></label>
<label>Section<select id="section"><option value="top">Hero</option><option value="about">About</option><option value="location">Location</option><option value="units">Units</option><option value="invest">Payment plan</option><option value="buyer-checklist">Buyer checklist</option><option value="faq">FAQ</option><option value="contact">Contact</option></select></label>
<button id="reload">Reload test page</button><button id="inspect">Inspect layout</button><span id="testStatus">Loading</span></header>
<div id="stage"><iframe id="preview" title="Prestigious Residence responsive preview"></iframe></div><pre id="report" aria-live="polite"></pre>
<script>
const frame=document.getElementById('preview'),stage=document.getElementById('stage'),size=document.getElementById('size'),result=document.getElementById('result'),section=document.getElementById('section');
function resize(){const[w,h]=size.value.split(',').map(Number),scale=Math.min(1,(innerWidth-32)/w);frame.width=w;frame.height=h;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';}
function jump(){const target=frame.contentDocument.getElementById(section.value);if(target)target.scrollIntoView({block:'start',behavior:'instant'});}
function load(){const q=new URLSearchParams({utm_source:'qa',utm_medium:'local',utm_campaign:'refinement',utm_content:'fixture',private_test:'must-not-be-forwarded'});if(result.value==='analytics_error'||result.value==='nojs')q.set(result.value,'1');else q.set('result',result.value);frame.src=(result.value==='nojs'?'/qa-nojs.html':'/qa-fixture.html')+'?'+q;}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,visible=e=>e.getClientRects().length&&w.getComputedStyle(e).visibility!=='hidden',seen=[...d.querySelectorAll('main section,main .benefits-strip,footer')];document.getElementById('report').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,sections:seen.map(e=>({id:e.id||e.className,width:Math.round(e.getBoundingClientRect().width),contentVisible:[...e.querySelectorAll('.fade-up')].every(x=>w.getComputedStyle(x).opacity==='1')})),images:[...d.images].map(i=>({alt:i.alt,loaded:i.complete&&i.naturalWidth>0})),menuExposed:visible(d.getElementById('mobileNav')),stepOneVisible:visible(d.getElementById('enquiryStep1')),stepTwoVisible:visible(d.getElementById('enquiryStep2')),eventCount:d.documentElement.dataset.eventCount||'0'},null,2);}
size.addEventListener('change',resize);window.addEventListener('resize',resize);result.addEventListener('change',load);section.addEventListener('change',jump);document.getElementById('reload').addEventListener('click',load);document.getElementById('inspect').addEventListener('click',inspect);frame.addEventListener('load',()=>{jump();document.getElementById('testStatus').textContent='Ready — actual iframe viewport; display may scale to fit';});resize();load();
</script></body></html>
