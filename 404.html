<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Prestigious Residence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #1a2535;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #c9a96e;
      margin-bottom: 48px;
    }
    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 400;
      color: rgba(201,169,110,0.15);
      line-height: 1;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 400;
      margin-bottom: 16px;
      color: white;
    }
    p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    a.btn {
      display: inline-block;
      padding: 14px 36px;
      background: transparent;
      border: 1.5px solid #c9a96e;
      color: #c9a96e;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    a.btn:hover { background: #c9a96e; color: #1a2535; }
  </style>
</head>
<body>
  <div class="logo">Prestigious Residence</div>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Head back to explore our units.</p>
  <a href="/" class="btn">Back to Home</a>
</body>
</html>
